# Local development database only. Production runs on the shared Postgres
# described in docs/hosting.md.

services:
  postgres:
    # Plain Postgres: the schema uses no extension beyond the defaults.
    image: postgres:17-alpine
    container_name: devgame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devgame
      POSTGRES_PASSWORD: devgame
      POSTGRES_DB: devgame
    ports:
      # 5443 on the host: this machine already runs Postgres on 5432 through 5442.
      # Override when that changes:
      # Override when you run several of these projects side by side:
      #   POSTGRES_PORT=5500 bun run db:up
      - "${POSTGRES_PORT:-5443}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devgame -d devgame"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
